<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" font-family="Arial, sans-serif" font-size="15">
  <rect width="1100" height="820" fill="#fff"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <g stroke="#000" stroke-width="2" fill="none">
    <!-- ESP32 -->
    <rect x="60" y="120" width="200" height="400" fill="#eef4ff"/>
    <!-- power module -->
    <rect x="890" y="30" width="180" height="80" fill="#fff4e0"/>
    <!-- 3V3 -> pot -->
    <path d="M260,160 H380 V190"/>
    <rect x="370" y="190" width="20" height="90" fill="#fff"/>
    <path d="M380,280 V300 H260"/>
    <!-- wiper -> GPIO4 -->
    <path d="M260,240 H366" marker-end="url(#arr)"/>
    <!-- GPIO17 -> R3 -> base -->
    <path d="M260,380 H480"/>
    <rect x="480" y="370" width="80" height="20" fill="#fff"/>
    <path d="M560,380 H732"/>
    <!-- R4 pulldown -->
    <path d="M620,380 V420"/>
    <rect x="610" y="420" width="20" height="80" fill="#fff"/>
    <path d="M620,500 V640"/>
    <!-- NPN -->
    <circle cx="760" cy="380" r="30"/>
    <path d="M732,380 H748"/>
    <path d="M748,360 V400" stroke-width="4"/>
    <path d="M748,370 L772,354 V290"/>
    <path d="M748,390 L772,406" marker-end="url(#arr)"/>
    <path d="M772,406 V640"/>
    <!-- motor -->
    <path d="M772,290 V278"/>
    <circle cx="772" cy="250" r="28" fill="#fff"/>
    <path d="M772,222 V160"/>
    <!-- diode across motor, cathode up -->
    <path d="M772,160 H930 V110"/>
    <path d="M772,290 H860 V270"/>
    <path d="M860,160 V230"/>
    <path d="M845,270 L875,270 L860,240 z" fill="#000"/>
    <path d="M845,238 H875" stroke-width="3"/>
    <!-- GPIO18 -> R2 -> LED -->
    <path d="M260,460 H330"/>
    <rect x="330" y="450" width="80" height="20" fill="#fff"/>
    <path d="M410,460 H470 V500"/>
    <path d="M455,500 L485,500 L470,530 z" fill="#ffd0d0"/>
    <path d="M455,532 H485" stroke-width="3"/>
    <path d="M470,532 V640"/>
    <path d="M490,505 L510,490" marker-end="url(#arr)" stroke-width="1.5"/>
    <path d="M492,520 L512,505" marker-end="url(#arr)" stroke-width="1.5"/>
    <!-- ESP GND -> bus, power GND -> bus -->
    <path d="M160,520 V640"/>
    <path d="M1030,110 V640"/>
    <path d="M160,640 H1030" stroke-width="3"/>
    <!-- ground symbol -->
    <path d="M590,640 V660 M570,660 H610 M578,668 H602 M586,676 H594"/>
  </g>
  <g fill="#000">
    <circle cx="620" cy="380" r="5"/>
    <circle cx="772" cy="160" r="5"/><circle cx="860" cy="160" r="5"/>
    <circle cx="772" cy="290" r="5"/><circle cx="860" cy="290" r="5"/>
    <circle cx="620" cy="640" r="5"/><circle cx="772" cy="640" r="5"/>
    <circle cx="470" cy="640" r="5"/><circle cx="590" cy="640" r="5"/>
  </g>
  <g>
    <text x="160" y="105" text-anchor="middle" font-weight="bold" font-size="17">ESP32-S3</text>
    <text x="250" y="165" text-anchor="end">3V3</text>
    <text x="250" y="245" text-anchor="end">GPIO4 (ADC1)</text>
    <text x="250" y="305" text-anchor="end">GND</text>
    <text x="250" y="385" text-anchor="end">GPIO17 (PWM)</text>
    <text x="250" y="465" text-anchor="end">GPIO18 (PWM)</text>
    <text x="160" y="512" text-anchor="middle">GND</text>

    <text x="980" y="65" text-anchor="middle" font-weight="bold">Модуль живлення</text>
    <text x="980" y="88" text-anchor="middle">(MB102), 5 В</text>
    <text x="938" y="135">+5V</text>
    <text x="1038" y="135">GND</text>

    <text x="400" y="225">R1 10 кОм</text>
    <text x="400" y="245">(потенціометр)</text>
    <text x="520" y="362" text-anchor="middle">R3 1 кОм</text>
    <text x="640" y="455">R4</text>
    <text x="640" y="475">10 кОм</text>
    <text x="370" y="442" text-anchor="middle">R2 220 Ом</text>
    <text x="520" y="525">LED1</text>
    <text x="800" y="385">Q1</text>
    <text x="800" y="405">2N2222A</text>
    <text x="745" y="350" font-size="13">C</text>
    <text x="745" y="425" font-size="13">E</text>
    <text x="722" y="372" font-size="13">B</text>
    <text x="772" y="257" text-anchor="middle" font-weight="bold" font-size="20">M</text>
    <text x="700" y="245" text-anchor="end">M1 двигун</text>
    <text x="885" y="250">D1</text>
    <text x="885" y="270">1N4007</text>
    <text x="1030" y="630" text-anchor="end" font-weight="bold">Спільна GND</text>
  </g>
  <g font-size="14">
    <text x="60" y="715">• R3 обмежує струм бази; R4 тримає Q1 закритим, поки GPIO не налаштований (під час завантаження).</text>
    <text x="60" y="738">• D1 — зворотний діод: катод до +5V, гасить ЕРС самоіндукції двигуна при вимкненні транзистора.</text>
    <text x="60" y="761">• Двигун живиться від модуля, не від ESP32. GND модуля обов'язково з'єднати з GND ESP32.</text>
    <text x="60" y="784">• 2N2222A витримує до ~600 мА: підходить для малого двигуна (з урахуванням пускового струму).</text>
  </g>
</svg>
